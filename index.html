<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detector de ISP y Validación de Acceso</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --success-color: #2ecc71;
            --danger-color: #e74c3c;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .info-group {
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 8px;
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
        }

        .label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #7f8c8d;
            margin-bottom: 5px;
        }

        .value {
            font-size: 1.2rem;
            font-weight: 600;
            color: #2c3e50;
        }

        .status {
            margin-top: 25px;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.3rem;
            text-transform: uppercase;
        }

        .status.allowed {
            background-color: rgba(46, 204, 113, 0.15);
            color: var(--success-color);
            border: 2px solid var(--success-color);
        }

        .status.denied {
            background-color: rgba(231, 76, 60, 0.15);
            color: var(--danger-color);
            border: 2px solid var(--danger-color);
        }

        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 24px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-allowed {
            background-color: var(--success-color);
            color: white;
            box-shadow: 0 4px 12px rgba(46, 204, 113, 0.2);
        }

        .btn-allowed:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(46, 204, 113, 0.3);
        }

        .loading {
            font-style: italic;
            color: #95a5a6;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Análisis de Conexión</h1>
        
        <div class="info-group">
            <div class="label">País</div>
            <div id="country" class="value loading">Detectando...</div>
        </div>

        <div class="info-group">
            <div class="label">Proveedor (ISP)</div>
            <div id="isp" class="value loading">Detectando...</div>
        </div>

        <div id="status-box" class="status" style="display: none;"></div>
        
        <a id="redirect-btn" class="btn btn-allowed" style="display: none;">Ir a Google</a>
    </div>

    <script>
        // Listado de códigos de país (ISO) de países hispanohablantes
        const spanishSpeakingCountries = [
            'AR', 'BO', 'CL', 'CO', 'CR', 'CU', 'DO', 'EC', 'SV', 'ES', 
            'GT', 'HN', 'MX', 'NI', 'PA', 'PY', 'PE', 'PR', 'UY', 'VE', 'GQ'
        ];

        async function checkConnection() {
            try {
                // Consulta a la API pública de ip-api para obtener la información de red, tipo e ISP
                const response = await fetch('http://ip-api.com/json/?fields=status,message,country,countryCode,isp,org,as,hosting');
                
                if (!response.ok) throw new Error('Error en la API');
                
                const data = await response.json();

                if (data.status !== 'success') {
                    document.getElementById('isp').innerText = 'Error al analizar';
                    return;
                }

                // Asignar los valores a la interfaz (ocultando por completo la IP)
                document.getElementById('country').innerText = `${data.country} (${data.countryCode})`;
                document.getElementById('isp').innerText = data.isp;

                const isSpanishSpeaking = spanishSpeakingCountries.includes(data.countryCode);
                
                // Determinar el tipo de infraestructura. La API provee la flag 'hosting' para datacenters/VPNs/proxies.
                // También analizamos palabras clave comunes en nombres de organizaciones de infraestructura.
                const isDatacenterOrVPN = data.hosting === true || 
                    /hosting|datacenter|vpn|cloud|server|ovh|digitalocean|aws|amazon|google cloud|azure|linode/i.test(data.isp) ||
                    /hosting|datacenter|vpn|cloud|server|ovh|digitalocean|aws|amazon|google cloud|azure|linode/i.test(data.org);

                const statusBox = document.getElementById('status-box');
                const redirectBtn = document.getElementById('redirect-btn');

                if (isDatacenterOrVPN) {
                    // Acceso denegado: es un datacenter o vpn
                    statusBox.innerText = "Conexión Rechazada";
                    statusBox.className = "status denied";
                    statusBox.style.display = "block";
                } else if (isSpanishSpeaking) {
                    // Acceso permitido: ISP doméstico de un país hispanohablante
                    statusBox.innerText = "Conexión Permitida";
                    statusBox.className = "status allowed";
                    statusBox.style.display = "block";

                    // Configurar enlace dinámico a Google según el requerimiento de España
                    if (data.countryCode === 'ES') {
                        redirectBtn.href = 'https://www.google.es';
                    } else {
                        redirectBtn.href = 'https://www.google.com';
                    }
                    redirectBtn.style.display = 'inline-block';
                } else {
                    // Fuera de la región hispanohablante
                    statusBox.innerText = "Conexión No Autorizada (Región)";
                    statusBox.className = "status denied";
                    statusBox.style.display = "block";
                }

            } catch (error) {
                console.error(error);
                document.getElementById('country').innerText = 'Error de conexión';
                document.getElementById('isp').innerText = 'No se pudo verificar';
            }
        }

        // Ejecutar al cargar la página
        window.onload = checkConnection;
    </script>
</body>
</html>
