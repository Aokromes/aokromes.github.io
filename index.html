<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detector de IP, País e ISP</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 24px;
        }
        .data-card {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            text-align: left;
        }
        .label {
            font-weight: bold;
            color: #7f8c8d;
            font-size: 14px;
            text-transform: uppercase;
        }
        .value {
            font-size: 18px;
            color: #2c3e50;
            margin-top: 5px;
        }
        .loading {
            color: #3498db;
            font-weight: bold;
        }
        footer {
            margin-top: 20px;
            font-size: 12px;
            color: #95a5a6;
        }
        footer a {
            color: #3498db;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Información de tu Conexión</h1>
    <div id="loader" class="loading">Detectando tu conexión...</div>
    
    <div id="result" style="display: none;">
        <div class="data-card">
            <div class="label">Dirección IP</div>
            <div id="ip" class="value">-</div>
        </div>
        <div class="data-card">
            <div class="label">País</div>
            <div id="country" class="value">-</div>
        </div>
        <div class="data-card">
            <div class="label">Proveedor de Internet (ISP / ASN)</div>
            <div id="isp" class="value">-</div>
        </div>
    </div>

    <footer>
        Datos optimizados usando <a href="https://github.com/ipverse/as-ip-blocks" target="_blank">ipverse/as-ip-blocks</a>
    </footer>
</div>

<script>
    async function getNetworkDetails() {
        try {
            // Obtenemos la IP pública y ASN actual del usuario usando una API pública rápida
            const res = await fetch('https://ipapi.co/json/');
            const data = await res.json();
            
            document.getElementById('ip').textContent = data.ip;
            document.getElementById('country').textContent = `${data.country_name} (${data.country})`;
            document.getElementById('isp').textContent = `${data.org} (${data.asn})`;
            
            document.getElementById('loader').style.display = 'none';
            document.getElementById('result').style.display = 'block';
        } catch (error) {
            document.getElementById('loader').textContent = 'Error al obtener los datos de red.';
            console.error(error);
        }
    }
    
    getNetworkDetails();
</script>

</body>
</html>
