<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detector de País e ISP</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 24px;
            font-size: 24px;
        }
        .info-group {
            margin-bottom: 20px;
        }
        .label {
            font-size: 14px;
            color: #7f8c8d;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .value {
            font-size: 18px;
            font-weight: 600;
            color: #2c3e50;
        }
        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 24px;
            color: white;
            background-color: #3498db;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #2980b9;
        }
        .loading {
            color: #e67e22;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Información de Red</h1>
    
    <div class="info-group">
        <div class="label">País</div>
        <div id="country" class="value loading">Detectando...</div>
    </div>
    
    <div class="info-group">
        <div class="label">Proveedor de Internet (ISP)</div>
        <div id="isp" class="value loading">Detectando...</div>
    </div>

    <a id="redirect-btn" class="btn" style="display: none;" href="#">Ir a Google</a>
</div>

<script>
    async function fetchNetworkData() {
        try {
            // Se realiza la consulta para obtener los datos geográficos y de red omitiendo la IP en pantalla
            const response = await fetch('https://ipapi.co/json/');
            if (!response.ok) throw new Error('Error en la solicitud');
            
            const data = await response.json();
            
            const countryElement = document.getElementById('country');
            const ispElement = document.getElementById('isp');
            const btnElement = document.getElementById('redirect-btn');
            
            // Asignación de valores
            const countryName = data.country_name || 'Desconocido';
            const countryCode = data.country || '';
            const ispName = data.org || 'Desconocido';
            
            countryElement.textContent = countryName;
            countryElement.classList.remove('loading');
            
            ispElement.textContent = ispName;
            ispElement.classList.remove('loading');
            
            // Lógica condicional según el país (España / Otro)
            if (countryCode.toUpperCase() === 'ES' || countryName.toLowerCase() === 'spain') {
                btnElement.href = 'https://www.google.es';
            } else {
                btnElement.href = 'https://www.google.com';
            }
            btnElement.style.display = 'inline-block';
            
        } catch (error) {
            document.getElementById('country').textContent = 'Error al cargar';
            document.getElementById('isp').textContent = 'Error al cargar';
            console.error(error);
        }
    }

    // Inicializar la detección al cargar la página
    fetchNetworkData();
</script>

</body>
</html>
