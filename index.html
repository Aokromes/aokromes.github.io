<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación de Conexión</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h2 {
            margin-top: 0;
            color: #333;
        }
        .info-group {
            margin: 1.5rem 0;
            text-align: left;
            background: #f9f9fb;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid #e5e5ea;
        }
        .info-label {
            font-size: 0.85rem;
            color: #86868b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.25rem;
        }
        .info-value {
            font-size: 1.1rem;
            font-weight: 600;
        }
        .status {
            font-size: 1.4rem;
            font-weight: bold;
            margin: 2rem 0 1rem 0;
            padding: 0.75rem;
            border-radius: 8px;
        }
        .status.allowed {
            color: #1d1d1f;
            background-color: #e2f5ec;
            color: #147a46;
        }
        .status.denied {
            background-color: #fde8e8;
            color: #9b1c1c;
        }
        .btn {
            display: inline-block;
            background-color: #0071e3;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            margin-top: 1rem;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #0077ed;
        }
        .loading {
            color: #86868b;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Estado de Acceso</h2>
    <div id="loader" class="loading">Analizando conexión segura...</div>
    
    <div id="content" style="display: none;">
        <div class="info-group">
            <div class="info-label">País</div>
            <div id="country-val" class="info-value">-</div>
        </div>
        <div class="info-group">
            <div class="info-label">Proveedor de Internet (ISP)</div>
            <div id="isp-val" class="info-value">-</div>
        </div>
        
        <div id="status-box" class="status"></div>
        <div id="action-box"></div>
    </div>
</div>

<script>
    // Listado de países hispanohablantes (Códigos ISO de 2 letras)
    const spanishSpeakingCountries = [
        'AR', 'BO', 'CL', 'CO', 'CR', 'CU', 'DO', 'EC', 'SV', 'GQ', 
        'GT', 'HN', 'MX', 'NI', 'PA', 'PY', 'PE', 'PR', 'ES', 'UY', 'VE'
    ];

    // Palabras clave que suelen delatar datacenters, hostings, VPNs o proxies en el campo de organización/org
    const datacenterKeywords = [
        'google', 'amazon', 'aws', 'microsoft', 'azure', 'cloudflare', 'fastly', 
        'digitalocean', 'linode', 'ovh', 'hetzner', 'leaseweb', 'datacenter', 
        'hosting', 'server', 'vps', 'vpn', 'proxy', 'm247', 'akamai', 'contabo'
    ];

    async function checkConnection() {
        try {
            // Uso estricto de la API especificada: https://ipapi.co/json
            const response = await fetch('https://ipapi.co/json');
            if (!response.ok) throw new Error('Error al conectar con la API de ipapi.co');
            
            const data = await response.json();
            
            const countryCode = (data.country_code || '').toUpperCase();
            const countryName = data.country_name || 'Desconocido';
            const orgName = data.org || data.asn || 'Desconocido';
            
            document.getElementById('country-val').textContent = countryName;
            document.getElementById('isp-val').textContent = orgName;
            
            const isSpanishSpeaking = spanishSpeakingCountries.includes(countryCode);
            
            // Detección heurística de datacenter/VPN basándose en el nombre de la organización de ipapi.co
            const lowerOrg = orgName.toLowerCase();
            const isDatacenterOrVpn = datacenterKeywords.some(keyword => lowerOrg.includes(keyword));
            
            const statusBox = document.getElementById('status-box');
            const actionBox = document.getElementById('action-box');
            
            if (isDatacenterOrVpn) {
                // Si es un datacenter o vpn, conexión rechazada en rojo
                statusBox.textContent = 'Conexión Rechazada';
                statusBox.className = 'status denied';
                actionBox.innerHTML = '';
            } else if (isSpanishSpeaking) {
                // Si es un ISP doméstico de cualquier país hispanohablante, conexión permitida en verde
                statusBox.textContent = 'Conexión Permitida';
                statusBox.className = 'status allowed';
                // Todos los países hispanohablantes permitidos van a google.es
                actionBox.innerHTML = '<a href="https://www.google.es" class="btn">Continuar a Google</a>';
            } else {
                // No es hispanohablante ni datacenter (otro país residencial)
                statusBox.textContent = 'Conexión Rechazada (Región no admitida)';
                statusBox.className = 'status denied';
                actionBox.innerHTML = '';
            }
            
            document.getElementById('loader').style.display = 'none';
            document.getElementById('content').style.display = 'block';
            
        } catch (error) {
            console.error(error);
            document.getElementById('loader').textContent = 'Error al verificar las credenciales de red. Por favor, reintente.';
        }
    }

    window.onload = checkConnection;
</script>

</body>
</html>
